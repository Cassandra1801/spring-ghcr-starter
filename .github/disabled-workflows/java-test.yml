#The on section specifies that the action will run on pushes and pull requests to the main branch.
#The workflow_dispatch event allows you to manually trigger the workflow from the GitHub Actions tab in your GitHub repository.
#The steps section defines the individual steps of the job:
#The first step checks out the repository code.
#The second step sets up the Java Development Kit (JDK) using the actions/setup-java action.
#The third step runs the Maven command to execute the tests.



name: Java test with caching
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Set up JDK
        uses: actions/setup-java@0781fc6af30d3e1f67f2d243034e1a15cf5f3677
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Run tests
        run: mvn -B test


# We have added a caching step to speed up the build process by reusing the downloaded Maven dependencies. This will significantly reduce the build time for subsequent runs.
#A cache-key is created based on the hash of the pom.xml file. If the pom.xml file changes, a new cache will be created. The restore-keys option allows the action to fall back to a more general cache if an exact match is not found.
#When the action runs, it will first check if there is a cache available for the current state of the pom.xml file. If a cache is found, it will restore the cached dependencies to the ~/.m2/repository directory before running the Maven tests.